name: CI — Verify All & Property Fuzzing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Production Build & UI Property Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/chairman_ci?schema=public"
      NEXTAUTH_SECRET: "ci-verification-secret-placeholder"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Gate 1 — Strict Modern Layer Lint (Zero Warnings, Zero Escape Hatches)
        run: npm run lint:strict

      - name: Gate 1 — Deterministic Static & Build Gate (tsc + eslint + next build)
        run: npm run verify:all

      - name: Install Playwright Headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Gate 2 — Property-Based UI Invariant Fuzzing (/roadmaps & /calendar)
        run: npm run test:properties
