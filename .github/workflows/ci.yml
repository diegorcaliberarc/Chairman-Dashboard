name: CI — Autonomous Software Factory v3.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 7-Stage Verify Gate (TS + ESLint + Zenity + Vitest + Pytest + Build) & Isolated UI Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: "postgresql://isolated:isolated@127.0.0.1:54399/chairman_isolated_test?schema=public"
      NEXTAUTH_SECRET: "ci-isolated-secret-placeholder"
      NEXTAUTH_URL: "http://127.0.0.1:3100"
      CHAIRMAN_TEST_ISOLATION: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Python Dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Frontend Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Gate 1 — Machine-Readable 7-Stage Verification Pipeline
        run: npm run verify:all:json

      - name: Install Playwright Headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Gate 2 — Spend-Isolated Property-Based UI Fuzzing (Port 3100)
        run: npm run test:properties
